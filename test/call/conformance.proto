syntax = "proto3";
package synurang.test;
option go_package = "github.com/ivere27/synurang/test/call/pb";
message Value { int32 value = 1; }
service Calls {
  rpc Unary(Value) returns (Value);
  rpc Server(Value) returns (stream Value);
  rpc Client(stream Value) returns (Value);
  rpc Bidi(stream Value) returns (stream Value);
  rpc Wait(Value) returns (Value);
  rpc Fail(Value) returns (Value);
}
