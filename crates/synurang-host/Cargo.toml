[package]
name = "synurang-host"
version = "0.1.0"
edition = "2021"
description = "Synurang host library for loading Go/C++/Rust plugins and spawning child processes"
license = "MIT"

[dependencies]
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tower = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["socket", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Security",
] }
